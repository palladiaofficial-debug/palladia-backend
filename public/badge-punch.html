<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F6F4F0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Timbratura">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json" id="pwa-manifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <title>Timbratura — Palladia</title>
  <script>
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var idx   = parts.indexOf('timbratura');
    var code  = idx !== -1 ? (parts[idx + 1] || '') : '';
    if (code && /^[A-Fa-f0-9]{18}$/i.test(code)) {
      document.getElementById('pwa-manifest').href = '/timbratura/' + code + '/manifest.json';
    }
  })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* F-214 (AUDIT.md): allineati ai token reali della piattaforma
         (src/index.css) — stessa palette editoriale di tutta Palladia,
         non più propria di questa pagina. Il verde/rosso restano un
         segnale funzionale (entrata/uscita), non decorazione — vedi
         .punch-btn.entry/.exit più sotto, invariato nel significato. */
      --bg:       #F6F4F0;
      --surface:  #ffffff;
      --border:   #F4F1EC;
      --text:     #1A1714;
      --muted:    #6E6459;
      --subtle:   #6E6459;
      --green:    #4A7358;
      --green-dk: #3A5C46;
      --red:      #A8453B;
      --red-dk:   #8F3A31;
      --amber:    #A6570A;
      --accent:   #22384F;
      --radius:   16px;
    }

    html, body {
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px calc(48px + env(safe-area-inset-bottom, 0px));
      min-height: 100dvh;
    }

    /* ── Brand header ── */
    .topbar {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 0 8px;
    }
    .brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Selettore lingua ── */
    .lang-switch {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 0 0 10px;
    }
    .lang-btn {
      min-width: 40px;
      height: 40px;
      padding: 0 10px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .lang-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Container ── */
    .wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }

    /* ── Card generica ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    /* ── Lavoratore badge ── */
    .worker-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
    }
    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .avatar-photo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .worker-info { flex: 1; min-width: 0; }
    .worker-name {
      font-size: 19px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .worker-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

    /* ── Cantiere info ── */
    .site-card {
      padding: 16px 20px;
    }
    .site-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .site-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .site-address { font-size: 13px; color: var(--muted); }

    /* ── Bottone punch — IL BOTTONE ── */
    .punch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 80px;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: opacity 0.12s, transform 0.1s;
      -webkit-appearance: none;
      text-transform: uppercase;
    }
    .punch-btn:active  { transform: scale(0.97); opacity: 0.9; }
    .punch-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .punch-btn.entry {
      background: var(--green);
      color: #fff;
    }
    .punch-btn.exit {
      background: var(--red);
      color: #fff;
    }
    .punch-icon { display: inline-flex; align-items: center; }

    /* F-213 (AUDIT.md): DDT trasportatori interni */
    .ddt-btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; margin-top: 10px; padding: 13px;
      border: 1.5px solid var(--text); border-radius: var(--radius);
      background: transparent; color: var(--text);
      font-family: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer; -webkit-appearance: none;
    }
    .ddt-btn:active { transform: scale(0.98); opacity: 0.85; }
    .cam-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
    .ddt-photo-frame {
      width: 100%; aspect-ratio: 4/3; border-radius: var(--radius); overflow: hidden;
      background: #111; margin-bottom: 14px; display: flex; align-items: center; justify-content: center;
    }
    .ddt-photo-frame img { width: 100%; height: 100%; object-fit: cover; }
    .ddt-field { margin-bottom: 10px; }
    .ddt-field label {
      display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
    }
    .ddt-field input {
      width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 12px;
      font-family: inherit; font-size: 15px; color: var(--text); background: #fff;
    }
    .ddt-cancel {
      display: block; width: 100%; margin-top: 10px; padding: 10px; text-align: center;
      background: none; border: none; color: var(--muted); font-family: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }

    /* ── GPS status ── */
    .gps-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 4px 0;
      min-height: 28px;
    }
    .gps-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .gps-dot.ok    { background: var(--green); }
    .gps-dot.warn  { background: var(--amber); animation: blink 1.2s infinite; }
    .gps-dot.error { background: var(--red); }
    .gps-dot.wait  { background: var(--muted); }
    .gps-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }
    .gps-text.ok    { color: var(--green); }
    .gps-text.warn  { color: var(--amber); }
    .gps-text.error { color: var(--red); }

    @keyframes blink { 50% { opacity: 0.3; } }

    /* ── Hint ── */
    .hint-text {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .hint-help {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── Schermata selezione cantiere ── */
    .site-select-label {
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }
    .site-select-sub {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
    }
    .site-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      width: 100%;
      padding: 18px 20px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-align: left;
      margin-bottom: 8px;
    }
    .site-btn:hover  { border-color: var(--accent); background: rgba(34,56,79,.06); }
    .site-btn:active { transform: scale(0.98); }
    .site-btn-name { font-size: 17px; font-weight: 700; color: var(--text); }
    .site-btn-addr { font-size: 13px; color: var(--muted); }
    .site-btn-dist { font-size: 12px; color: var(--green); font-weight: 600; margin-top: 2px; }

    /* ── Stato successo ── */
    .success-wrap {
      text-align: center;
      padding: 32px 20px 24px;
    }
    .success-icon { font-size: 56px; line-height: 1; margin-bottom: 16px; display: block; }
    .success-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .success-sub   { font-size: 15px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
    .success-close { font-size: 13px; color: var(--muted); }

    /* ── Errore ── */
    .error-wrap {
      text-align: center;
      padding: 36px 20px 28px;
    }
    .error-icon  { display: flex; justify-content: center; margin-bottom: 14px; color: var(--red); }
    .error-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .error-sub   { font-size: 15px; color: var(--muted); line-height: 1.6; }
    .error-retry {
      display: block; width: 100%; margin-top: 24px;
      padding: 16px; font-size: 16px; font-weight: 800; font-family: inherit;
      color: #fff; background: var(--text); border: none; border-radius: 16px;
      cursor: pointer;
    }
    /* F-171 (AUDIT.md): variante secondaria — usata per "Riprova" quando
       "Avvisa il responsabile" (error-retry, piena) diventa l'azione primaria
       su OUTSIDE_GEOFENCE/GPS_REQUIRED, dove ricaricare quasi mai risolve. */
    .error-retry-secondary {
      display: block; width: 100%; margin-top: 24px;
      padding: 14px; font-size: 15px; font-weight: 700; font-family: inherit;
      color: inherit; background: transparent; border: 1.5px solid currentColor;
      opacity: 0.7; border-radius: 16px; cursor: pointer;
    }

    /* ── Loading ── */
    .spinner {
      display: block;
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-wrap {
      text-align: center;
      padding: 56px 20px;
    }
    .loading-text { font-size: 14px; color: var(--muted); margin-top: 16px; }

    /* ── Spinner nel bottone ── */
    .btn-spinner {
      display: inline-block;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .65s linear infinite;
    }

    .hidden { display: none !important; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeUp 0.3s ease-out both; }

    /* ── Guida permessi GPS ── */
    #gps-guide {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 400;
      padding: 0;
    }
    #gps-guide.hidden { display: none !important; }
    .gps-sheet {
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0));
      width: 100%;
      max-width: 520px;
      max-height: 85dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: slideUp .28s ease-out both;
    }
    .gps-guide-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px; height: 64px;
      border-radius: 50%;
      background: #fef2f2;
      margin: 0 auto 18px;
    }
    .gps-guide-icon svg { width: 32px; height: 32px; color: #dc2626; }
    .gps-guide-title {
      font-size: 20px; font-weight: 800; color: #111827;
      text-align: center; margin-bottom: 6px; line-height: 1.25;
    }
    .gps-guide-sub {
      font-size: 14px; color: #6b7280; text-align: center;
      margin-bottom: 24px; line-height: 1.5;
    }
    .gps-steps { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
    .gps-step {
      display: flex; align-items: flex-start; gap: 12px;
    }
    .gps-step-num {
      width: 28px; height: 28px; background: var(--red);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: #fff; flex-shrink: 0; margin-top: 1px;
    }
    .gps-step-text {
      flex: 1; font-size: 15px; color: #374151; line-height: 1.5;
    }
    .gps-step-text strong { color: #111827; }
    .gps-guide-note {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px;
      padding: 12px 14px; font-size: 13px; color: #1e40af; line-height: 1.5;
      margin-bottom: 20px; text-align: center;
    }
    .gps-btn-retry {
      display: block; width: 100%; padding: 16px;
      background: var(--red); color: #fff; border: none; border-radius: 14px;
      font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
      margin-bottom: 10px;
    }
    .gps-btn-retry:active { opacity: 0.85; transform: scale(0.98); }

    /* ── Guida salvataggio Home ── */
    #pwa-guide {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 300;
      padding: 0;
    }
    #pwa-guide.hidden { display: none !important; }

    .pwa-sheet {
      background: #ffffff;
      border-top: 1px solid #e4e7ec;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0));
      width: 100%;
      max-width: 520px;
      max-height: 85dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: slideUp .28s ease-out both;
    }
    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .pwa-handle {
      width: 40px; height: 4px;
      background: #d1d5db;
      border-radius: 2px;
      margin: 0 auto 22px;
    }
    .pwa-headline {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
      text-align: center;
      margin-bottom: 6px;
      line-height: 1.25;
    }
    .pwa-sub {
      font-size: 14px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 26px;
      line-height: 1.5;
    }
    .pwa-steps { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
    .pwa-step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .pwa-step-num {
      width: 30px; height: 30px;
      background: #000000;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff;
      flex-shrink: 0; margin-top: 1px;
    }
    .pwa-step-text {
      flex: 1;
      font-size: 15px;
      color: #374151;
      line-height: 1.5;
    }
    .pwa-step-text strong { color: #111827; }
    .pwa-step-icon { font-size: 19px; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; color: var(--accent); }

    .pwa-note {
      background: #fefce8;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #78350f;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .pwa-btn-primary {
      display: block;
      width: 100%;
      padding: 16px;
      background: #000000;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 12px;
      letter-spacing: 0.01em;
    }
    .pwa-btn-skip {
      display: block;
      width: 100%;
      padding: 14px;
      min-height: 48px;
      background: none;
      color: #9ca3af;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand" style="display:flex;align-items:center;gap:6px">Palladia</div>
  </div>
  <!-- F-214 (AUDIT.md): riga propria, non più un angolo assoluto — i pulsanti
       erano 26px, sotto la soglia minima di tocco (44px) per un'app usata
       spesso con i guanti. -->
  <div class="lang-switch" id="lang-switch"></div>

  <!-- Guida attivazione GPS — si apre quando il permesso è negato -->
  <div id="gps-guide" class="hidden">
    <div class="gps-sheet">
      <div class="pwa-handle"></div>
      <div class="gps-guide-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
      <div class="gps-guide-title" id="gps-guide-title"></div>
      <div class="gps-guide-sub" id="gps-guide-sub"></div>
      <div class="gps-steps" id="gps-steps"></div>
      <div class="gps-guide-note" id="gps-guide-note"></div>
      <button class="gps-btn-retry" id="gps-btn-retry" onclick="location.reload()"></button>
    </div>
  </div>

  <!-- Guida salvataggio Home — si apre automaticamente, contenuto generato da JS -->
  <div id="pwa-guide" class="hidden">
    <div class="pwa-sheet">
      <div class="pwa-handle"></div>
      <div class="pwa-headline" id="pwa-headline">Salva sulla schermata Home</div>
      <div class="pwa-sub" id="pwa-sub"></div>
      <div class="pwa-steps" id="pwa-steps"><!-- riempito da JS --></div>
      <div class="pwa-note" id="pwa-note" style="display:none"></div>
      <button class="pwa-btn-primary" id="pwa-btn-primary" onclick="pwaGuideAction()"></button>
      <button class="pwa-btn-skip" id="pwa-btn-skip" onclick="pwaGuideSkip()"></button>
    </div>
  </div>

  <div class="wrap" id="wrap">
    <!-- Contenuto iniettato da JS -->
    <div class="card loading-wrap">
      <span class="spinner"></span>
      <div class="loading-text" id="initial-loading-text">Lettura badge in corso…</div>
    </div>
  </div>

  <script>
  'use strict';

  // ── i18n ──────────────────────────────────────────────────────────────────────
  // Dizionario leggero dedicato a questa sola pagina (stesso pattern di
  // src/lib/i18n/timbratura.ts nel repo frontend — vedi ARCHITECTURE.md).
  // Traduzioni curate ma non riviste da un madrelingua: da far rileggere prima
  // di un rollout oltre il pilota, specialmente le guide GPS/PWA passo-passo.
  var LANG_CODES = ['it', 'ro', 'sq', 'ar'];
  var RTL_LANGS  = ['ar'];
  var LANG_STORAGE_KEY = 'palladia_badge_lang';

  function detectDefaultLang() {
    try {
      var saved = localStorage.getItem(LANG_STORAGE_KEY);
      if (saved && LANG_CODES.indexOf(saved) !== -1) return saved;
    } catch (e) {}
    var nav = (navigator.language || '').slice(0, 2).toLowerCase();
    if (LANG_CODES.indexOf(nav) !== -1) return nav;
    return 'it';
  }

  var LANG = detectDefaultLang();

  var I18N = {
    it: {
      langNative: 'IT',
      loadingText: 'Lettura badge in corso…',
      ifProblems: 'Se hai problemi, avvisa il responsabile.',
      chooseSite: 'Scegli il cantiere',
      whereWorking: 'Dove stai lavorando?',
      selectSiteToPunch: 'Seleziona il cantiere per timbrare la presenza.',
      inCantiere: 'Sei in cantiere', outCantiere: 'Sei fuori cantiere',

  function t() { return I18N[LANG]; }

  function applyDir() {
    document.documentElement.dir = RTL_LANGS.indexOf(LANG) !== -1 ? 'rtl' : 'ltr';
    document.documentElement.lang = LANG;
  }

  function renderLangSwitch() {
    var el = document.getElementById('lang-switch');
    if (!el) return;
    el.innerHTML = LANG_CODES.map(function (code) {
      return '<button class="lang-btn' + (code === LANG ? ' active' : '') + '" onclick="setLang(\'' + code + '\')">' +
        esc(I18N[code].langNative) + '</button>';
    }).join('');
  }

  // Ogni render* imposta questo riferimento PRIMA di costruire il markup, così
  // setLang() può ridisegnare esattamente la schermata attiva senza dover
  // indovinare lo stato (bug reale trovato dal vivo: cambiare lingua sulla
  // schermata di errore lasciava il testo in italiano, solo il selettore si
  // aggiornava — renderError() non era mai tra i casi gestiti qui).
  var _rerenderCurrent = null;

  function setLang(code) {
    if (LANG_CODES.indexOf(code) === -1) return;
    LANG = code;
    try { localStorage.setItem(LANG_STORAGE_KEY, code); } catch (e) {}
    applyDir();
    renderLangSwitch();
    if (_rerenderCurrent) {
      _rerenderCurrent();
    } else {
      var initialLoading = document.getElementById('initial-loading-text');
      if (initialLoading) initialLoading.textContent = t().loadingText;
    }
  }

  applyDir();
  renderLangSwitch();
  document.getElementById('initial-loading-text').textContent = t().loadingText;

  // ── Config ────────────────────────────────────────────────────────────────────
  const API = '';

  // Estrai badge code dall'URL: /timbratura/{badge_code}
  function getBadgeCode() {
    const parts = window.location.pathname.split('/').filter(Boolean);
    const idx   = parts.indexOf('timbratura');
    return idx !== -1 ? (parts[idx + 1] || '') : '';
  }

  const BADGE_CODE = getBadgeCode();

  // testo semplice (mai emoji, ma nemmeno un'icona vera). Un'unica fonte
  // riusata nei 4 punti che oggi impostano #btn-icon, così non può esistere
  // un quinto punto dimenticato con un carattere diverso.
  const ICON_ENTRY = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M7 5l12 7-12 7V5z"/></svg>';
  const ICON_EXIT  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
  const ICON_WAIT  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>';

  // ── Helpers ───────────────────────────────────────────────────────────────────
  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtTime(iso) {
    try {
      return new Date(iso).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    } catch { return ''; }
  }

  async function apiFetch(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    // Timeout esplicito: senza, un backend lento (non un vero errore di rete,
    // che invece rifiuta subito) lascia lo spinner di timbratura girare
    // all'infinito. Lasciamo che l'abort si propaghi come eccezione — i
    // chiamanti (vedi handlePunch) già trattano qualunque eccezione come
    // "offline": mettono la timbratura in coda locale e la ritentano da soli,
    // che è esattamente il comportamento giusto anche per un server lento.
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    opts.signal = controller.signal;
    try {
      const r = await fetch(API + path, opts);
      const json = await r.json().catch(() => ({}));
      return { status: r.status, body: json };
    } finally {
      clearTimeout(timeoutId);
    }
  }

    var isSamsung = /samsungbrowser/i.test(navigator.userAgent);
    var stepsEl = document.getElementById('gps-steps');
    var noteEl  = document.getElementById('gps-guide-note');
    if (!stepsEl) return;

    var variant = isIos ? 'ios' : (isSamsung ? 'samsung' : 'other');
    var steps = t().gpsGuideSteps[variant];
    var note  = t().gpsGuideNotes[variant];

    var titleEl = document.getElementById('gps-guide-title');
    var subEl   = document.getElementById('gps-guide-sub');
    var retryBtn = document.getElementById('gps-btn-retry');
    if (titleEl) titleEl.textContent = t().activatePosition;
    if (subEl) subEl.innerHTML = t().gpsGuideSub;
    if (retryBtn) retryBtn.textContent = t().haveActivatedRetry;

    stepsEl.innerHTML = steps.map(function (s) {
      return '<div class="gps-step">' +
        '<div class="gps-step-num">' + s.n + '</div>' +
        '<div class="gps-step-text">' + s.text + '</div>' +
        '</div>';
    }).join('');

    if (noteEl) noteEl.innerHTML = note;

    var guide = document.getElementById('gps-guide');
    if (guide) {
      guide.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
  }

  // ── GPS ───────────────────────────────────────────────────────────────────────
  // Usa watchPosition (non getCurrentPosition) per ricevere letture continue.
  // Su iOS/Android la prima lettura è spesso da antenna cellulare (>500m).
  // Le letture successive migliorano progressivamente man mano che il chip GPS si aggancia.
  // Teniamo sempre la lettura con la precisione migliore ricevuta finora.

  function startGps() {
    if (!navigator.geolocation) {
      gpsStatus = 'error';
      gpsText   = t().gpsUnavailableDevice;
      updateGpsRow();
      showGpsPermissionGuide();
      return;
    }

    gpsWatcher = navigator.geolocation.watchPosition(
      pos => {
        gpsAttempts++;
        const acc = pos.coords.accuracy;
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        // Teniamo solo la lettura migliore (accuracy più bassa = più precisa)
        if (!gpsCoords || acc < gpsCoords.accuracy) {
          gpsCoords = { latitude: lat, longitude: lon, accuracy: acc };
        }

        if (acc <= maxAccuracyM) {
          gpsStatus = 'ok';
          gpsText   = t().gpsPositionDetected(Math.round(acc));
        } else if (gpsAttempts <= 2) {
          // Prime letture: di solito da cella, aspettiamo miglioramento
          gpsStatus = 'wait';
          gpsText   = t().gpsAcquiring(Math.round(acc));
        } else {
          gpsStatus = 'warn';
          gpsText   = t().gpsWeakSignal(Math.round(acc));
        }

        updateGpsRow();
        if (!punching) updatePunchButton();
      },
      err => {
        if (err.code === 1) {
          // PERMISSION_DENIED — definitivo, mostra guida passo-passo
          gpsStatus = 'error';
          gpsText   = t().gpsPermissionDeniedFollow;
          gpsCoords = null;
          stopGps();
          showGpsPermissionGuide();
        } else {
          // POSITION_UNAVAILABLE o TIMEOUT — temporaneo, continua a watchare
          if (!gpsCoords) {
            gpsStatus = 'warn';
            gpsText   = t().gpsSlowRetry;
          }
        }
        updateGpsRow();
        if (!punching) updatePunchButton();
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
    );
  }

  function stopGps() {
    if (gpsWatcher !== null) {
      navigator.geolocation.clearWatch(gpsWatcher);
      gpsWatcher = null;
    }
  }

  // Aspetta fino a timeoutMs per una lettura GPS con accuracy <= targetAccuracyM.
  // Risolve con {latitude, longitude, accuracy} oppure null se timeout/non disponibile.
  // Il watcher viene pulito al termine — non interferisce con startGps() successivo.
  function waitForGps(timeoutMs, targetAccuracyM) {
    return new Promise(resolve => {
      if (!navigator.geolocation) { resolve(null); return; }

      let watchId = null;
      let best    = null;

      const done = () => {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        resolve(best);
      };

      const timer = setTimeout(done, timeoutMs);

      watchId = navigator.geolocation.watchPosition(
        pos => {
          const acc = pos.coords.accuracy;
          if (!best || acc < best.accuracy) {
            best = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: acc };
          }
          if (acc <= targetAccuracyM) {
            clearTimeout(timer);
            done();
          }
        },
        () => { /* errori temporanei: il timeout risolverà */ },
        { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 30000 }
      );
    });
  }

  function updateGpsRow() {
    const el = document.getElementById('gps-row');
    if (!el) return;
    el.innerHTML = `
      <span class="gps-dot ${gpsStatus}"></span>
      <span class="gps-text ${gpsStatus}">${esc(gpsText)}</span>`;
  }

  function updatePunchButton() {
    const btn = document.getElementById('punch-btn');
    if (!btn || punching) return;

    if (!gpsCoords) {
      // GPS non ancora disponibile — bottone disabilitato con spiegazione
      btn.disabled = true;
      const lbl = document.getElementById('btn-label');
      if (lbl) lbl.textContent = t().waitingGps;
    } else {
      // GPS disponibile — bottone attivo con label corretta
      btn.disabled = false;
      const s = selectedSite;
      if (s) {
        const lbl = document.getElementById('btn-label');
        const ico = document.getElementById('btn-icon');
        if (lbl) lbl.textContent = s.next_action === 'EXIT' ? t().registraUscita : t().registraEntrata;
        if (ico) ico.innerHTML = s.next_action === 'EXIT' ? ICON_EXIT : ICON_ENTRY;
      }
    }
  }

  // Codici per cui "avvisa il responsabile" ha senso come azione immediata (il
  // lavoratore è fisicamente presente ma il sistema non riesce a registrarlo) —
  // F-171 (AUDIT.md). Richiede selectedSite già scelto: vero per tutti questi
  // codici, che arrivano solo da doPunch() dopo la selezione del cantiere.
  const HELP_BUTTON_CODES = ['OUTSIDE_GEOFENCE', 'GPS_REQUIRED', 'SERVER_ERROR'];

  // Su OUTSIDE_GEOFENCE/GPS_REQUIRED "Riprova" (reload) quasi mai risolve — il
  // lavoratore è dov'è, ricaricare la pagina non lo sposta. In quei due casi
  // "Avvisa il responsabile" diventa l'azione PRIMARIA (pieno, in evidenza),
  // non un link secondario facile da non notare da chi è già frustrato — è
  // l'unica cosa che lo sblocca davvero finché non arriva la tolleranza GPS
  // pianificata (F-170, AUDIT.md).
  const HELP_PRIMARY_CODES = ['OUTSIDE_GEOFENCE', 'GPS_REQUIRED'];

  // ── Render: errore ─────────────────────────────────────────────────────────────
  function renderError(code, extraSub) {
    _rerenderCurrent = function () { renderError(code, extraSub); };
    const cfg = t().errorCopy[code] || t().errorCopy.SERVER_ERROR;
    const sub = extraSub ? `${cfg.sub}<br>${extraSub}` : cfg.sub;
    const showHelpButton = HELP_BUTTON_CODES.includes(code) && !!selectedSite;
    const helpIsPrimary  = showHelpButton && HELP_PRIMARY_CODES.includes(code);
    const helpReason     = code === 'OUTSIDE_GEOFENCE' ? 'OUTSIDE_GEOFENCE' : 'OTHER';

    const retryBtnHtml = `<button class="${helpIsPrimary ? 'error-retry-secondary' : 'error-retry'}" onclick="location.reload()">${esc(t().retry)}</button>`;
    const helpBtnHtml = showHelpButton ? `
      <button id="error-help-btn" ${helpRequestSent ? 'disabled' : ''} onclick="sendHelpRequest('${helpReason}', this)"
        class="${helpIsPrimary ? 'error-retry' : ''}"
        style="${helpIsPrimary
          ? 'margin-top:10px;'
          : 'width:100%;padding:12px;background:transparent;color:inherit;border:1.5px solid currentColor;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;opacity:0.85;'}">
        ${esc(helpRequestSent ? t().helpSent : t().askHelpButton)}
      </button>` : '';

    wrap.innerHTML = `
      <div class="card error-wrap fade-in">
        <span class="error-icon">${cfg.icon}</span>
        <div class="error-title">${cfg.title}</div>
        <div class="error-sub">${sub}</div>
        ${helpIsPrimary ? helpBtnHtml + retryBtnHtml : retryBtnHtml + helpBtnHtml}
      </div>
      <div class="hint-help">${esc(t().ifProblems)}</div>`;
  }

  // ── Render: consenso privacy (F-178, AUDIT.md) ───────────────────────────────
  // Schermo bloccante mostrato quando punch-context riporta
  // requires_privacy_consent:true — nessuna timbratura è possibile finché
  // POST /badge/:code/consent non ha registrato l'accettazione lato server.
  function renderPrivacyConsent() {
    _rerenderCurrent = renderPrivacyConsent;
    const c = t().privacyConsent;

    wrap.innerHTML = `
      <div class="card fade-in">
        <p style="font-size:19px;font-weight:700;color:var(--text);margin-bottom:10px;">${esc(c.title)}</p>
        <p style="font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.6;">${esc(c.intro)}</p>
        <ul style="font-size:14px;color:var(--muted);margin-bottom:14px;padding-left:18px;line-height:1.9;">
          ${c.bullets.map(b => `<li>${esc(b)}</li>`).join('')}
        </ul>
        <p style="font-size:12px;color:var(--subtle);margin-bottom:20px;line-height:1.6;border-top:1px solid var(--border);padding-top:14px;">${esc(c.footer)}</p>
        <button class="error-retry" id="btn-accept-privacy-consent">${esc(c.acceptButton)}</button>
        <p id="privacy-consent-error" class="hidden" style="color:#dc2626;font-size:13px;margin-top:10px;"></p>
      </div>`;

    document.getElementById('btn-accept-privacy-consent').addEventListener('click', async function () {
      const btn = this;
      btn.disabled = true;
      const errEl = document.getElementById('privacy-consent-error');
      errEl.classList.add('hidden');
      try {
        const { status } = await apiFetch('POST', `/api/v1/badge/${BADGE_CODE}/consent`);
        if (status !== 200) throw new Error('status ' + status);
        // Riparte da capo: rilegge punch-context, che ora non richiederà più il consenso.
        await main();
      } catch (e) {
        btn.disabled = false;
        errEl.textContent = t().errorCopy.NETWORK_ERROR.sub;
        errEl.classList.remove('hidden');
      }
    });
  }

  // ── Render: selezione cantiere ─────────────────────────────────────────────────
  function renderSiteSelection() {
    _rerenderCurrent = renderSiteSelection;
    const sites = workerData.sites;

    const siteButtons = sites.map(s => {
      const nextLabel = s.next_action === 'EXIT' ? t().inCantiere : t().outCantiere;
      const distStr   = s.distance_m != null ? ` · ${s.distance_m}m` : '';
      return `
        <button class="site-btn" onclick="selectSite('${esc(s.site_id)}')">
          <span class="site-btn-name">${esc(s.site_name)}</span>

          <span class="site-btn-dist">${esc(nextLabel)}${esc(distStr)}</span>
        </button>`;

    wrap.innerHTML = `
      <div class="card worker-card fade-in">

      <button class="ddt-cancel fade-in" onclick="renderUnassignedCantiereForm()" style="margin-top:2px;">${esc(t().ddt.unassignedLink)}</button>

      <div class="hint-help">${esc(t().ifProblems)}</div>`;

  // ── F-214: DDT su un cantiere non ancora censito in Palladia ──────────────────
  // Nessun selectedSite qui — il trasportatore scrive il nome a mano, il DDT
  // finisce come spesa "da assegnare" (vedi routes/v1/badgeDdt.js) e il
  // titolare lo riassocia al cantiere vero dalla scheda Spese appena lo crea.
  function renderUnassignedCantiereForm() {
    _rerenderCurrent = renderUnassignedCantiereForm;
    const T = t().ddt;
    wrap.innerHTML = `
      <div class="card fade-in" style="padding:20px;">
        <div class="site-select-label">${esc(T.unassignedTitle)}</div>
        <div class="site-select-sub" style="margin-bottom:12px;">${esc(T.unassignedHint)}</div>
        <div class="ddt-field" style="margin-bottom:0;">
          <input id="unassigned-cantiere-name" placeholder="${esc(T.unassignedPlaceholder)}" autofocus>
        </div>
      </div>
      <button class="punch-btn entry fade-in" id="unassigned-continue-btn" onclick="confirmUnassignedCantiereName()">
        <span>${esc(t().continueLabel)}</span>
      </button>
      <button class="ddt-cancel fade-in" onclick="renderSiteSelection()">${esc(T.cancel)}</button>`;
    document.getElementById('unassigned-cantiere-name').focus();
  }

  function confirmUnassignedCantiereName() {
    const input = document.getElementById('unassigned-cantiere-name');
    const name  = (input.value || '').trim();
    if (!name) { input.style.borderColor = '#dc2626'; input.focus(); return; }
    unassignedCantiereName = name;
    openDdtCamera();
  }

  // ── Render: schermata punch ────────────────────────────────────────────────────
  // isRelang=true → ridisegno per cambio lingua: NON deve far ripartire il GPS
  // (watchPosition già attivo, riavviarlo duplicherebbe il watcher).
  function renderPunchScreen(isRelang) {
    _rerenderCurrent = function () { renderPunchScreen(true); };
    const s           = selectedSite;
    const isExit      = s.next_action === 'EXIT';
    const btnClass    = isExit ? 'exit' : 'entry';
    const btnLabel    = isExit ? t().registraUscita : t().registraEntrata;
    const statusLabel = isExit ? t().inCantiereStatus : t().fuoriCantiereStatus;

    wrap.innerHTML = `
      <div class="card worker-card fade-in">
        ${workerData.photo_url
          ? `<img src="${esc(workerData.photo_url)}" class="avatar-photo" alt="">`
          : `<div class="avatar">${esc(workerData.worker_initial)}</div>`}
        <div class="worker-info">
          <div class="worker-name">${esc(workerData.worker_name)}</div>
          <div class="worker-sub" id="status-sub">${esc(statusLabel)}</div>
        </div>
      </div>

      <div class="card site-card fade-in">
        <div class="site-label">${esc(t().cantiereLabel)}</div>
        <div class="site-name">${esc(s.site_name)}</div>
        ${s.address ? `<div class="site-address">${esc(s.address)}</div>` : ''}
      </div>

      <!-- result-card: usato per messaggi GPS retry e successo inline -->
      <div id="result-card" class="hidden"></div>

      <div class="fade-in" style="display:flex;flex-direction:column;gap:8px;">
        <button class="punch-btn ${btnClass}" id="punch-btn" disabled onclick="doPunch()">
          <span class="punch-icon" id="btn-icon">${ICON_WAIT}</span>
          <span id="btn-label">${esc(t().waitingGps)}</span>
        </button>

        <div class="gps-row" id="gps-row">
          <span class="gps-dot wait"></span>
          <span class="gps-text">${esc(t().waitingGps)}</span>
        </div>
      </div>

      <div class="hint-text fade-in">
        ${esc(t().pressButtonHint)}
      </div>

      <!-- F-213 (AUDIT.md): DDT trasportatori interni — stesso badge/cantiere
           già selezionati per la timbratura, nessuna nuova identità. -->
      <button class="ddt-btn fade-in" id="ddt-open-btn" onclick="openDdtCamera()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:8px;"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>${esc(t().ddt.buttonLabel)}</button>

      <div class="hint-help" id="help-hint">
        ${helpRequestSent
          ? esc(t().helpSent)
          : `<a href="#" id="help-link" onclick="sendHelpRequest('OTHER', this); return false;" style="color:inherit;text-decoration:underline;">${esc(t().askHelpLink)}</a>`}
      </div>`;

    if (isRelang) {
      // Il watcher GPS è già attivo — ripristina solo lo stato già noto nel nuovo markup
      updateGpsRow();
      updatePunchButton();
    } else {
      // Avvia GPS — i callback aggiorneranno bottone e riga GPS via updatePunchButton/updateGpsRow
      startGps();
    }
  }

  // ── DDT trasportatori interni (F-213, AUDIT.md) ──────────────────────────────
  // Foto → lettura AI (routes/v1/badgeDdt.js, riusa lib/siteCostOcr.js già in
  // uso per fatture/ricevute) → conferma → salvato. Stessa identità badge e
  // stesso cantiere già selezionati per la timbratura, nessun nuovo login.
  let ddtPreviewUrl = null;

  function openDdtCamera() {
    let input = document.getElementById('ddt-cam-input');
    if (!input) {
      input = document.createElement('input');
      input.type = 'file';
      input.id = 'ddt-cam-input';
      input.className = 'cam-input';
      input.accept = 'image/*';
      input.setAttribute('capture', 'environment');
      document.body.appendChild(input);
      input.addEventListener('change', function () {
        if (input.files && input.files[0]) handleDdtFileSelected(input.files[0]);
        input.value = '';
      });
    }
    input.click();
  }

  function renderDdtLoading(previewUrl, label) {
    wrap.innerHTML = `
      <div class="ddt-photo-frame fade-in">${previewUrl ? `<img src="${previewUrl}" alt="">` : ''}</div>
      <div class="hint-text fade-in" style="text-align:center;">${esc(label)}</div>`;
  }

  function renderDdtError(message) {
    wrap.innerHTML = `
      <div class="card fade-in" style="text-align:center; padding:28px 20px;">
        <div style="font-size:32px;margin-bottom:10px;">!</div>
        <div style="font-size:15px;font-weight:700;margin-bottom:6px;">${esc(message)}</div>
      </div>
      <button class="punch-btn entry fade-in" onclick="openDdtCamera()"><span>${esc(t().retry)}</span></button>
      <button class="ddt-cancel fade-in" onclick="cancelDdt()">${esc(t().ddt.cancel)}</button>`;
  }

  async function handleDdtFileSelected(file) {
    if (file.size > 10 * 1024 * 1024) { renderDdtError(t().ddt.fileTooLarge); return; }
    if (ddtPreviewUrl) URL.revokeObjectURL(ddtPreviewUrl);
    ddtPreviewUrl = URL.createObjectURL(file);
    renderDdtLoading(ddtPreviewUrl, t().ddt.reading);

    try {
      const fd = new FormData();
      fd.append('file', file);
      if (unassignedCantiereName) fd.append('cantiere_libero', unassignedCantiereName);
      else fd.append('site_id', selectedSite.site_id);
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000);
      const r = await fetch(API + '/api/v1/badge/' + BADGE_CODE + '/ddt/scan', { method: 'POST', body: fd, signal: controller.signal });
      clearTimeout(timeoutId);
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.message || body.error || 'scan failed');
      renderDdtConfirm(body.fields || {}, body.file_url);
    } catch (err) {
      renderDdtError(t().ddt.uploadError);
    }
  }

  function renderDdtConfirm(fields, fileUrl) {
    const T = t().ddt;
    wrap.innerHTML = `
      <div class="ddt-photo-frame fade-in">${ddtPreviewUrl ? `<img src="${ddtPreviewUrl}" alt="">` : ''}</div>
      <div class="hint-text fade-in" style="margin-bottom:4px;">${esc(T.confirmHint)}</div>

      <div class="card" style="padding:14px;">
        <div class="ddt-field">
          <label>${esc(T.fieldSupplier)}</label>
          <input id="ddt-f-fornitore" value="${esc(fields.fornitore || '')}">
        </div>
        <div class="ddt-field">
          <label>${esc(T.fieldDocNumber)}</label>
          <input id="ddt-f-numero" value="${esc(fields.numero_documento || '')}">
        </div>
        <div class="ddt-field">
          <label>${esc(T.fieldDate)}</label>
          <input id="ddt-f-data" type="date" value="${esc(fields.data_documento || '')}">
        </div>
        <div class="ddt-field" style="margin-bottom:0;">
          <label>${esc(T.fieldDescription)}</label>
          <input id="ddt-f-descrizione" value="${esc(fields.descrizione || '')}">
        </div>
      </div>

      <button class="punch-btn entry fade-in" id="ddt-confirm-btn" onclick="confirmDdtSave('${esc(fileUrl)}')" style="margin-top:12px;">
        <span>${esc(T.confirmButton)}</span>
      </button>
      <div id="ddt-confirm-error" class="hint-text fade-in" style="text-align:center;color:#dc2626;display:none;"></div>
      <button class="ddt-cancel fade-in" onclick="cancelDdt()">${esc(T.cancel)}</button>`;
  }

  async function confirmDdtSave(fileUrl) {
    const T = t().ddt;
    const btn = document.getElementById('ddt-confirm-btn');
    const errEl = document.getElementById('ddt-confirm-error');
    if (errEl) errEl.style.display = 'none';
    if (btn) { btn.disabled = true; btn.querySelector('span').textContent = T.savingButton; }

    const payload = {
      file_url:         fileUrl,
      ...(unassignedCantiereName ? { cantiere_libero: unassignedCantiereName } : { site_id: selectedSite.site_id }),
      fornitore:        document.getElementById('ddt-f-fornitore').value,
      numero_documento: document.getElementById('ddt-f-numero').value,
      data_documento:   document.getElementById('ddt-f-data').value,
      descrizione:      document.getElementById('ddt-f-descrizione').value,
      tipo:             'ddt',
    };

    try {
      const { status, body } = await apiFetch('POST', '/api/v1/badge/' + BADGE_CODE + '/ddt/confirm', payload);
      if (status !== 201) throw new Error(body.message || body.error || 'save failed');
      renderDdtSuccess(body.today_count || 1);
    } catch (err) {
      if (btn) { btn.disabled = false; btn.querySelector('span').textContent = T.confirmButton; }
      if (errEl) { errEl.textContent = T.saveError; errEl.style.display = 'block'; }
    }
  }

  function cancelDdt() {
    if (ddtPreviewUrl) { URL.revokeObjectURL(ddtPreviewUrl); ddtPreviewUrl = null; }
    if (unassignedCantiereName) { unassignedCantiereName = null; renderSiteSelection(); }
    else renderPunchScreen();
  }

  function renderDdtSuccess(count) {
    const T = t().ddt;
    const linkedTo = unassignedCantiereName || selectedSite.site_name;
    wrap.innerHTML = `
      <div class="card fade-in" style="text-align:center; padding:32px 20px;">
        <span class="success-icon">✓</span>
        <div class="success-title">${esc(T.savedTitle)}</div>
        <div class="success-sub">${esc(T.savedSub)} ${esc(linkedTo)}</div>
        <div class="hint-help" style="margin-top:6px;">${esc(T.todayCount(count))}</div>
      </div>`;
    if (ddtPreviewUrl) { URL.revokeObjectURL(ddtPreviewUrl); ddtPreviewUrl = null; }
    if (unassignedCantiereName) { unassignedCantiereName = null; setTimeout(renderSiteSelection, 2200); }
    else setTimeout(renderPunchScreen, 2200);
  }

  // ── Render: successo ───────────────────────────────────────────────────────────
  function renderSuccess(eventType, tsServer, siteName) {
    _rerenderCurrent = function () { renderSuccess(eventType, tsServer, siteName); };
    stopGps();
    const isEntry   = eventType === 'ENTRY';
    const icon      = isEntry ? '✓' : '■';
    const titleText = isEntry ? t().entrataRegistrata : t().uscitaRegistrata;
    const color     = isEntry ? '#22c55e' : '#ef4444';

    wrap.innerHTML = `
      <div class="card success-wrap fade-in">
        <span class="success-icon">${icon}</span>
        <div class="success-title" style="color:${color};">${esc(titleText)}</div>
        <div class="success-sub">
          ${esc(siteName)}<br>
          ${fmtTime(tsServer)}
        </div>
        <div class="success-close">${esc(t().canCloseAfterSuccess)}</div>
      </div>`;
  }

  // ── Chiedi aiuto (F-171, AUDIT.md) ─────────────────────────────────────────────
  // Un tap avvisa subito l'amministratore (Telegram + notifica in-app) — non
  // deve mai richiedere al lavoratore di risolvere un problema tecnico sul
  // proprio telefono solo per segnalare che non riesce a timbrare.
  let helpRequestSent = false;

  async function sendHelpRequest(reason, el) {
    if (!selectedSite || helpRequestSent) return;
    const idleText = el && el.tagName === 'A' ? t().askHelpLink : t().askHelpButton;
    if (el) { el.setAttribute('disabled', 'true'); el.textContent = t().askingHelp; }
    try {
      await apiFetch('POST', `/api/v1/badge/${BADGE_CODE}/help-request`, {
        site_id: selectedSite.site_id,
        reason,
      });
      helpRequestSent = true;
      if (el) { el.textContent = t().helpSent; }
    } catch {
      if (el) { el.removeAttribute('disabled'); el.textContent = idleText; }
    }
  }

  // ── GPS scarso: mostra avviso con retry ma non blocca definitivamente ─────────
  function showGpsRetry() {
    const resultCard = document.getElementById('result-card');
    if (!resultCard) return;

    resultCard.className = '';
    resultCard.style.cssText = 'background:#FBF0E6;border:1.5px solid #A6570A;border-radius:16px;padding:20px;text-align:center;margin-bottom:12px;';
    resultCard.innerHTML = `
      <div style="margin-bottom:10px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A6570A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
      <div style="font-size:17px;font-weight:700;color:#A6570A;margin-bottom:6px;">${esc(t().gpsNotPrecise)}</div>
      <div style="font-size:14px;color:#6E6459;margin-bottom:16px;line-height:1.5;">
        ${esc(t().gpsRetryHint)}
      </div>
      <button onclick="retryAfterGps()" style="width:100%;padding:14px;background:var(--text);color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;">
        ${esc(t().retry)}
      </button>
      <button id="gps-help-btn" ${helpRequestSent ? 'disabled' : ''} onclick="sendHelpRequest('GPS_ACCURACY_TOO_LOW', this)" style="width:100%;padding:12px;background:transparent;color:#A6570A;border:1.5px solid #A6570A;border-radius:16px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;">
        ${esc(helpRequestSent ? t().helpSent : t().askHelpButton)}
      </button>`;
    resultCard.classList.remove('hidden');
  }

  function retryAfterGps() {
    const resultCard = document.getElementById('result-card');
    if (resultCard) {
      resultCard.classList.add('hidden');
      resultCard.style.cssText = '';
    }
    // Ripristina bottone
    const btn = document.getElementById('punch-btn');
    if (btn) {
      btn.disabled = !gpsCoords;
      const lbl = document.getElementById('btn-label');
      if (lbl && selectedSite) {
        lbl.textContent = selectedSite.next_action === 'EXIT' ? t().registraUscita : t().registraEntrata;
      }
      const ico = document.getElementById('btn-icon');
      if (ico && selectedSite) {
        ico.innerHTML = selectedSite.next_action === 'EXIT' ? ICON_EXIT : ICON_ENTRY;
      }
    }
  }

  // ── Selezione cantiere da lista ────────────────────────────────────────────────
  function selectSite(siteId) {
    const site = workerData.sites.find(s => s.site_id === siteId);
    if (!site) return;
    selectedSite = site;
    renderPunchScreen();
  }

  // ── Punch ─────────────────────────────────────────────────────────────────────
  // F-184 (AUDIT.md): un id per TENTATIVO di timbratura, non per richiesta
  // HTTP — permette al server di riconoscere un retry (dopo un errore di
  // rete ambiguo: la richiesta potrebbe essere arrivata comunque) come lo
  // stesso tentativo invece di un tocco nuovo, che su un endpoint a toggle
  // capovolgerebbe entrata/uscita. crypto.randomUUID richiede iOS 15.4+ /
  // contesto sicuro (sempre vero qui, HTTPS) — fallback per WebView datate.
  function genClientRequestId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = (Math.random() * 16) | 0;
      var v = c === 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16);
    });
  }

  async function doPunch() {
    if (punching) return;
    if (!gpsCoords) {
      // GPS non disponibile — mostra il messaggio nella riga GPS, non un alert
      gpsStatus = 'error';
      gpsText   = t().gpsPositionUnavailableActivate;
      updateGpsRow();
      return;
    }

    // Stesso id per tutta la durata di questo tentativo, riusato identico
    // se il tentativo finisce in coda offline e viene rispedito più tardi.
    var clientRequestId = genClientRequestId();

    punching = true;
    const btn   = document.getElementById('punch-btn');
    const label = document.getElementById('btn-label');
    const icon  = document.getElementById('btn-icon');

    if (btn)   { btn.disabled = true; }
    if (icon)  { icon.innerHTML = '<span class="btn-spinner"></span>'; }
    if (label) { label.textContent = t().registrazione; }

    try {
      const { status, body } = await apiFetch('POST', `/api/v1/badge/${BADGE_CODE}/punch`, {
        site_id:            selectedSite.site_id,
        latitude:           gpsCoords.latitude,
        longitude:          gpsCoords.longitude,
        gps_accuracy_m:     gpsCoords.accuracy,
        client_request_id:  clientRequestId,
      });

      if (status === 200) {
        renderSuccess(body.event_type, body.timestamp_server, body.site_name || selectedSite.site_name);
        setTimeout(requestPushPermission, 2000);
        return;
      }

      // Errori gestiti
      if (status === 429 && body.error === 'PUNCH_TOO_SOON') {
        const mins = body.retry_after_secs ? Math.ceil(body.retry_after_secs / 60) : 1;
        renderError('PUNCH_TOO_SOON', mins > 0 ? t().minuteRetry(mins) : null);
        return;
      }
      if (status === 403 && body.error === 'OUTSIDE_GEOFENCE') {
        // F-170 (AUDIT.md): numeri reali invece di un messaggio generico —
        // max_allowed_m + tolerance_m è la soglia effettiva applicata, non
        // solo il raggio grezzo del cantiere (ora esiste una tolleranza sulla
        // precisione GPS).
        const effectiveMax = body.max_allowed_m + (body.tolerance_m || 0);
        renderError('OUTSIDE_GEOFENCE', t().geofenceDetail(body.distance_m, effectiveMax, body.gps_accuracy_m));
        return;
      }
      if (status === 422 && body.error === 'GPS_ACCURACY_TOO_LOW') {
        // Non è un errore permanente — mostra retry, non dead-end
        showGpsRetry();
        return;
      }
      if (status === 422 && body.error === 'GPS_REQUIRED') {
        renderError('GPS_REQUIRED');
        return;
      }
      if (status === 403 && body.error === 'BADGE_REVOKED') {
        renderError('BADGE_REVOKED');
        return;
      }
      if (status === 404 && body.error === 'BADGE_NOT_FOUND') {
        renderError('BADGE_NOT_FOUND');
        return;
      }
      if (status === 403 && body.error === 'WORKER_NOT_AUTHORIZED_ON_SITE') {
        renderError('WORKER_NOT_AUTHORIZED_ON_SITE');
        return;
      }

      renderError('SERVER_ERROR');

    } catch (e) {
      // Offline (o rete ambigua — vedi F-184, AUDIT.md): salva in coda locale
      // per retry automatico, con LO STESSO client_request_id già usato sopra
      // — se questo tentativo era in realtà già arrivato al server, il
      // server riconosce il replay invece di capovolgere entrata/uscita.
      var punchPayload = {
        site_id:            selectedSite.site_id,
        latitude:           gpsCoords.latitude,
        longitude:          gpsCoords.longitude,
        gps_accuracy_m:     gpsCoords.accuracy,
        client_request_id:  clientRequestId,
      };
      queueOfflinePunch(punchPayload, selectedSite.site_name);
      renderOfflineSuccess(selectedSite.site_name);
      return;
    } finally {
      punching = false;
      var ico2 = document.getElementById('btn-icon');
      if (ico2 && ico2.querySelector('.btn-spinner')) {
        ico2.innerHTML = selectedSite?.next_action === 'EXIT' ? ICON_EXIT : ICON_ENTRY;
      }
      updatePunchButton();
    }
  }

  // ── Offline Queue ──────────────────────────────────────────────────────────
  var OFFLINE_KEY = 'palladia_offline_punches';

  function getOfflineQueue() {
    try { return JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]'); } catch { return []; }
  }
  function saveOfflineQueue(q) {
    try { localStorage.setItem(OFFLINE_KEY, JSON.stringify(q)); } catch {}
  }

  function queueOfflinePunch(payload, siteName) {
    var q = getOfflineQueue();
    q.push({ payload: payload, siteName: siteName, savedAt: new Date().toISOString() });
    saveOfflineQueue(q);
  }

  function renderOfflineSuccess(siteName) {
    _rerenderCurrent = function () { renderOfflineSuccess(siteName); };
    stopGps();
    wrap.innerHTML =
      '<div class="card fade-in" style="text-align:center;padding:32px 20px;">' +
        '<span style="display:block;margin-bottom:16px;color:#A6570A;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;"><path d="M2 8.5a17 17 0 0 1 20 0"/><path d="M5 12a12 12 0 0 1 14 0"/><path d="M8.5 15.5a7 7 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/><path d="M3 3l18 18"/></svg></span>' +
        '<div style="font-size:22px;font-weight:800;color:#A6570A;margin-bottom:6px;">' + esc(t().offlineSavedTitle) + '</div>' +
        '<div style="font-size:15px;color:#6E6459;margin-bottom:20px;line-height:1.5;">' +
          esc(siteName) + '<br>' + t().offlineSavedHint +
        '</div>' +
        '<div style="font-size:13px;color:#6E6459;">' + esc(t().canClose) + '</div>' +
      '</div>';
  }

  var _syncing = false;
  async function syncOfflineQueue() {
    if (_syncing) return;
    var q = getOfflineQueue();
    if (!q.length) return;
    _syncing = true;

    var remaining = [];
    for (var i = 0; i < q.length; i++) {
      try {
        var r = await apiFetch('POST', '/api/v1/badge/' + BADGE_CODE + '/punch', q[i].payload);
        if (r.status === 200) {
          console.log('[offline-sync] punch inviato:', q[i].siteName);
        } else if (r.status === 429) {
          remaining.push(q[i]);
        }
        // 4xx diverso da 429: scarta (dati non validi, badge revocato, etc.)
      } catch {
        remaining.push(q[i]);
        break; // ancora offline, riprova dopo
      }
    }

    saveOfflineQueue(remaining);
    _syncing = false;

    if (remaining.length === 0 && q.length > 0) {
      updateOfflineBadge();
    }
  }

  function updateOfflineBadge() {
    var badge = document.getElementById('offline-badge');
    var q = getOfflineQueue();
    if (q.length > 0) {
      if (!badge) {
        badge = document.createElement('div');
        badge.id = 'offline-badge';
        badge.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#d97706;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px 12px;z-index:500;';
        document.body.prepend(badge);
      }
      badge.textContent = t().offlineBadge(q.length);
    } else if (badge) {
      badge.remove();
    }
  }

  // Sync quando torna la rete
  window.addEventListener('online', function () {
    setTimeout(syncOfflineQueue, 1500);
  });

  // Sync al caricamento pagina
  setTimeout(function () {
    updateOfflineBadge();
    if (navigator.onLine) syncOfflineQueue();
  }, 2000);

  // ── Main ─────────────────────────────────────────────────────────────────────
  async function main() {
    if (!BADGE_CODE || !/^[A-Fa-f0-9]{18}$/i.test(BADGE_CODE)) {
      renderError('INVALID_BADGE_CODE');
      return;
    }

    // Aspetta fino a 3s per un fix GPS (accuracy ≤ 200m) prima di interrogare il backend.
    // Così il backend può calcolare le distanze e fare auto-select corretto anche per
    // lavoratori assegnati a più cantieri. Su Android il GPS cached risolve in <100ms.
    const initialGps = await waitForGps(3000, 200);
    if (initialGps) {
      gpsCoords = initialGps;
    }

    // Fetch punch-context, con GPS se disponibile — accuracy inclusa (F-170,
    // AUDIT.md) così in_geofence riflette la stessa tolleranza del POST /punch,
    // altrimenti la UI mostrerebbe "fuori raggio" per un cantiere che la
    // timbratura accetterebbe comunque.
    let contextUrl = `/api/v1/badge/${BADGE_CODE}/punch-context`;
    if (gpsCoords) {
      contextUrl += `?lat=${gpsCoords.latitude}&lon=${gpsCoords.longitude}&accuracy=${gpsCoords.accuracy}`;
    }

    let res;
    try {
      res = await apiFetch('GET', contextUrl);
    } catch (e) {
      renderError('NETWORK_ERROR');
      return;
    }

    const { status, body } = res;

    if (status === 404) { renderError('BADGE_NOT_FOUND');  return; }
    if (status === 403) { renderError('BADGE_REVOKED');    return; }
    if (status === 400) { renderError('INVALID_BADGE_CODE'); return; }
    if (status !== 200) { renderError('SERVER_ERROR');     return; }

    workerData    = body;
    maxAccuracyM  = body.max_gps_accuracy_m || 500;

    // F-178 (AUDIT.md): nessuna timbratura finché il consenso non è
    // registrato lato server — controllato prima di qualunque altro stato.
    if (body.requires_privacy_consent) {
      renderPrivacyConsent();
      return;
    }

    if (!body.sites || body.sites.length === 0) {
      renderError('NO_SITES');
      return;
    }

    // Auto-select cantiere
    if (body.auto_selected_site_id) {
      selectedSite = body.sites.find(s => s.site_id === body.auto_selected_site_id);
      if (selectedSite) {
        renderPunchScreen();
        return;
      }
    }

    // Nessun auto-select → mostra selezione
    renderSiteSelection();
  }

  // ── PWA ──────────────────────────────────────────────────────────────────────

  // Persistenza badge code in localStorage.
  // Se l'app viene aperta dall'icona home (standalone) senza code nell'URL,
  // redirect al codice salvato così non serve riscansionare il QR.
  (function () {
    var parts = window.location.pathname.split('/').filter(Boolean);
    var idx   = parts.indexOf('timbratura');
    var code  = idx !== -1 ? (parts[idx + 1] || '') : '';
    if (code && /^[A-Fa-f0-9]{18}$/i.test(code)) {
      try { localStorage.setItem('palladia_badge_code', code); } catch (e) {}
    } else {
      var standalone = window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone === true;
      if (standalone) {
        var saved = null;
        try { saved = localStorage.getItem('palladia_badge_code'); } catch (e) {}
        if (saved && /^[A-Fa-f0-9]{18}$/i.test(saved)) {
          window.location.replace('/timbratura/' + saved);
        }
      }
    }
  })();

  // Service Worker — richiesto per installabilità PWA + push notifications
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .catch(function (e) { console.warn('[PWA] SW:', e.message); });
  }

  // Push notifications — chiede il permesso dopo la prima timbratura riuscita
  function requestPushPermission() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    if (typeof Notification === 'undefined' || Notification.permission !== 'default') return;
    Notification.requestPermission().then(function (perm) {
      if (perm === 'granted') subscribePush();
    });
  }

  function subscribePush() {
    navigator.serviceWorker.ready.then(function (reg) {
      fetch('/api/v1/push/vapid-public-key').then(function (r) { return r.json(); }).then(function (d) {
        if (!d.vapidPublicKey) return;
        var rawKey = atob(d.vapidPublicKey.replace(/-/g,'+').replace(/_/g,'/'));
        var keyArr = new Uint8Array(rawKey.length);
        for (var i = 0; i < rawKey.length; i++) keyArr[i] = rawKey.charCodeAt(i);
        return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyArr });
      }).then(function (sub) {
        if (!sub) return;
        var json = sub.toJSON();
        fetch('/api/v1/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ endpoint: json.endpoint, keys: json.keys }),
        }).catch(function () {});
      }).catch(function () {});
    });
  }

  if (typeof Notification !== 'undefined' && Notification.permission === 'granted') subscribePush();

  // ── Guida salvataggio Home ────────────────────────────────────────────────────
  var _pwaPrompt = null; // beforeinstallprompt Android Chrome

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    _pwaPrompt = e;
    // Aggiorna il bottone se la guida è già aperta
    var btn = document.getElementById('pwa-btn-primary');
    if (btn) { btn.textContent = t().installNow; }
  });

  window.addEventListener('appinstalled', function () {
    pwaGuideHide();
  });

  function pwaDetect() {
    var ua = navigator.userAgent;
    var isIos     = /iphone|ipad|ipod/i.test(ua);
    var isSamsung = /samsungbrowser/i.test(ua);
    var isFirefox = /firefox/i.test(ua) && !isIos;
    var isOpera   = /opr\//i.test(ua);
    if (isIos)     return 'ios';
    if (isSamsung) return 'samsung';
    if (isFirefox) return 'firefox';
    if (isOpera)   return 'opera';
    return 'chrome'; // Chrome, Edge, WebView, default
  }

  function pwaGuideBuild() {
    var browser  = pwaDetect();
    var steps    = t().pwaSteps[browser] || t().pwaSteps.chrome;
    var note     = t().pwaNotes[browser];
    var headline = document.getElementById('pwa-headline');
    var subEl    = document.getElementById('pwa-sub');
    var stepsEl  = document.getElementById('pwa-steps');
    var noteEl   = document.getElementById('pwa-note');
    var btnEl    = document.getElementById('pwa-btn-primary');
    var skipEl   = document.getElementById('pwa-btn-skip');

    if (headline) headline.textContent = t().saveToHome;
    if (subEl) subEl.textContent = t().saveToHomeSub;
    if (skipEl) skipEl.textContent = t().notNowLater;

    if (stepsEl) {
      stepsEl.innerHTML = steps.map(function (s) {
        return '<div class="pwa-step">' +
          '<div class="pwa-step-num">' + s.n + '</div>' +
          '<div class="pwa-step-icon">' + s.icon + '</div>' +
          '<div class="pwa-step-text">' + s.text + '</div>' +
          '</div>';
      }).join('');
    }

    if (noteEl) {
      if (note) { noteEl.innerHTML = note; noteEl.style.display = ''; }
      else       { noteEl.style.display = 'none'; }
    }

    if (btnEl) {
      // Se il prompt nativo è già disponibile (Android Chrome) cambia il bottone
      btnEl.textContent = _pwaPrompt ? t().installNow : t().understoodTry;
    }
  }

  function pwaGuideShow() {
    var guide = document.getElementById('pwa-guide');
    if (!guide) return;
    pwaGuideBuild();
    guide.classList.remove('hidden');
    // Blocca scroll del body mentre la guida è aperta
    document.body.style.overflow = 'hidden';
  }

  function pwaGuideHide() {
    var guide = document.getElementById('pwa-guide');
    if (guide) guide.classList.add('hidden');
    document.body.style.overflow = '';
  }

  function pwaGuideAction() {
    // Android Chrome con prompt nativo: avvia installazione diretta
    if (_pwaPrompt) {
      _pwaPrompt.prompt();
      _pwaPrompt.userChoice.then(function () {
        _pwaPrompt = null;
        pwaGuideHide();
      });
      return;
    }
    // Tutti gli altri: l'utente ha letto le istruzioni, chiude la guida
    pwaGuideHide();
    try { localStorage.setItem('palladia_pwa_guide_done', '1'); } catch (e) {}
  }

  function pwaGuideSkip() {
    pwaGuideHide();
    // "adesso no" → non salvare il flag, così ricompare alla prossima apertura
  }

  // Mostra la guida se: non in standalone, non già completata
  (function () {
    var standalone = window.matchMedia('(display-mode: standalone)').matches ||
                     window.navigator.standalone === true;
    if (standalone) return; // già installata — non serve la guida

    var done = false;
    try { done = !!localStorage.getItem('palladia_pwa_guide_done'); } catch (e) {}
    if (done) return;

    // Bug reale trovato dal vivo (screenshot): il vecchio setTimeout fisso
    // mostrava la guida 800ms dopo il load SEMPRE, anche sopra "Badge
    // disattivato" o la guida permessi GPS — due overlay sovrapposti,
    // testo illeggibile. Ora aspetta che la pagina sia in uno stato "calmo"
    // (niente caricamento, niente errore, niente guida GPS aperta) prima di
    // mostrarsi, ritentando invece di sparare alla cieca. Se resta bloccata
    // (es. badge disattivato per sempre) smette di ritentare dopo 30s.
    //
    // F-197 (AUDIT.md): mancava il check sull'Informativa Privacy (F-178) —
    // la guida si montava sopra anche lì, e "Adesso no, faccio dopo" non
    // salva alcun flag (vedi pwaGuideSkip sopra), quindi ricompariva sopra
    // il consenso a OGNI apertura: un lavoratore che rifiutava
    // l'installazione restava bloccato in un loop, senza poter mai
    // raggiungere "Ho letto e accetto".
    var attempts = 0;
    (function maybeShow() {
      attempts++;
      var gpsGuide = document.getElementById('gps-guide');
      var gpsOpen  = gpsGuide && !gpsGuide.classList.contains('hidden');
      var loading  = !!wrap.querySelector('.loading-wrap');
      var errorScreen = !!wrap.querySelector('.error-wrap');
      var privacyOpen = !!(workerData && workerData.requires_privacy_consent);
      if (gpsOpen || loading || errorScreen || privacyOpen) {
        if (attempts < 20) setTimeout(maybeShow, 1500);
        return;
      }
      pwaGuideShow();
    })();
  })();

  main().catch(function (err) {
    console.error('[badge-punch] main() failed:', err);
    renderError('SERVER_ERROR');
  });
  </script>
</body>
</html>
