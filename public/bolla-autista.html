<title>Bolle</title>

  F-515 (AUDIT.md del frontend, 19/11/2026): l'app «Bolle» degli autisti.
  Disegno approvato: https://claude.ai/artifact/E4d9HCsoL8AdgkEhXuFgvW
  (prima versione F-500 del 14/11: https://claude.ai/artifact/LPH4yjojwZ2reVsnJ8Jhry)
  - Si mette sulla schermata Home dal link personale /timbratura/:code/foto
    (manifest /timbratura/:code/foto.webmanifest, icona /bolle-icon-180.png).
    Lo stesso file si apre dal tasto del badge su /timbratura/:code/bolla.
  - 4 tocchi: icona → «Fotografa la bolla» → scatto → «Usa foto». Poi parte da
    sola: «✓ Presa» (è nel telefono), «✓✓ Arrivata» (è in ufficio). Niente
    «Manda», niente domande: il cantiere lo capisce il server, se no l'ufficio.
  - Se la lettura dice che non è una bolla: «Non sembra una bolla» → «Rifai la
    foto» (scarta la sbagliata). «Questa bolla ha un'altra pagina» la aggiunge.
  - Prima di mandarla la bolla va nella coda del telefono (bolla-coda.js): se
    la rete manca o l'app si chiude, parte da sola alla prossima occasione.
  Lingue: quella scelta nel badge (palladia_badge_lang). Traduzioni non ancora
  riviste da un madrelingua.
-->

  var installata = navigator.standalone === true || !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  if (/^[A-Fa-f0-9]{18}$/.test(code)) document.getElementById('manifesto').href = '/timbratura/' + code + '/foto.webmanifest';
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {}); } catch (e) { /* */ }

  var m = document.getElementById('m');
  var cam = document.getElementById('cam'), fileIn = document.getElementById('file');
  var info = null;     // { nome, oggi: [...] }
  var ultima = null;   // { id, r, mini, presa, arrivata, pagine }
  var modo = 'nuova';  // 'nuova' | 'pagina'

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function mostra(html) { m.innerHTML = html; window.scrollTo(0, 0); }
  function su(id, fn) { var el = document.getElementById(id); if (el) el.onclick = fn; }
  function uuid() { try { return crypto.randomUUID(); } catch (e) { return Date.now().toString(36) + Math.random().toString(36).slice(2); } }
  function ora() { return new Date().toLocaleTimeString(lingua === 'ar' ? 'ar' : 'it-IT', { hour: '2-digit', minute: '2-digit' }); }
  var CAM = function (w, sw) { return '<svg width="' + w + '" height="' + w + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2.2) + '" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'; };
  var PIU = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  var SPUNTA = function (w) { return '<svg width="' + w + '" height="' + w + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'; };
  var DOPPIA = '<svg width="22" height="18" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l5 5 9-10"/><path d="M12 15l2 2 9-10"/></svg>';
  var ATTENZIONE = '<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 7v6"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9.5"/></svg>';
  var NORETE = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01M3 3l18 18"/></svg>';

  // ── Intestazione ──
  function testa() {
    var h = document.getElementById('testa');
    var nome = info && info.nome ? '<span class="chi" id="chi">' + esc(info.nome) + '</span>' : '<span class="chi" id="chi"></span>';
    h.innerHTML = dalBadge
      ? '<a class="indietro" href="' + BADGE + '" data-testid="bolla-torna"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>' + esc(t.badge) + '</span></a>' + nome
      : '<span class="marchio"><span class="logo" style="color:#fff">' + CAM(18) + '</span>Bolle</span>' + nome;
  }

  // ── Le foto: rimpicciolite prima di mandarle (la rete in cantiere è lenta) ──
  function rimpicciolisci(f) {
    return new Promise(function (ok) {
      if (!/^image\/(jpeg|png|webp)$/.test(f.type) || !window.createImageBitmap) return ok(f);
      createImageBitmap(f).then(function (img) {
        var lato = 2000, k = Math.min(1, lato / Math.max(img.width, img.height));
        if (k === 1 && f.size < 2.5 * 1024 * 1024) return ok(f);
        var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { ok(b && b.size < f.size ? b : f); }, 'image/jpeg', 0.85);
      }).catch(function () { ok(f); });
    });
  }
  function scatta(cosa) { modo = cosa || 'nuova'; (touch ? cam : fileIn).click(); }
  function scegliFile(cosa) { modo = cosa || 'nuova'; fileIn.click(); }
  function preso(input) {
    var f = input.files && input.files[0]; input.value = '';
    if (!f) return;
    if (!/^image\//.test(f.type) && f.type !== 'application/pdf') return avviso(t.tipo);
    rimpicciolisci(f).then(function (b) {
      if (b.size > MAXB) return avviso(t.grande);
      var tipo = b.type || f.type;
      var p = { blob: b, type: tipo, name: 'pagina.' + (tipo === 'application/pdf' ? 'pdf' : 'jpg'), url: /^image\//.test(tipo) ? URL.createObjectURL(b) : null };
      if (modo === 'pagina' && ultima) aggiungiPagina(p); else mandaNuova(p);
    });
  }
  cam.onchange = function () { preso(cam); };
  fileIn.onchange = function () { preso(fileIn); };
  function avviso(testo) {
    var el = document.getElementById('avviso');
    if (el) { el.textContent = testo; el.hidden = false; }
  }

  // ── Schermate ──
  function vistaInizio() {
    ultima = null;
    var fatte = (info && info.oggi) || [];
    mostra(
      '<button type="button" class="tastone" id="b-foto" data-testid="bolla-fai-foto">' + CAM(84, 1.8) +
        '<span class="t disp">' + esc(touch ? t.titolo : t.titoloPc) + '</span><span class="s">' + esc(touch ? t.sotto : t.sottoPc) + '</span></button>' +
      '<div id="attesa"></div>' +
      '<p id="avviso" class="avviso" role="alert" hidden></p>' +
      (fatte.length ? '<section class="oggi" data-testid="bolla-oggi"><div class="testa"><span class="tit">' + esc(t.oggi) + '</span><span class="n">' + esc(t.arrivate(fatte.length)) + '</span></div>' +
        fatte.map(function (b) { return '<div class="r"><span class="a"><span class="f">' + esc(b.fornitore || t.bolla) + '</span><span class="c">' + esc(b.cantiere || t.daScegliere) + '</span></span><span class="o">' + esc(b.ora) + '</span></div>'; }).join('') + '</section>' : '') +
      (touch ? '<div class="piede"><button type="button" class="link" id="b-file" data-testid="bolla-scegli-file">' + esc(t.scegli) + '</button></div>' : '')
    );
    su('b-foto', function () { scatta('nuova'); });
    su('b-file', function () { scegliFile('nuova'); });
    mostraAttesa();
  }
  function spunte(u, inViaggio) {
    return '<div class="spunte"><span class="mini">' + (u.mini ? '<img src="' + u.mini + '" alt="">' : 'PDF') + '</span><span class="righe-spunte">' +
      '<span class="sp" data-testid="bolla-presa">' + SPUNTA(18) + esc(t.presa) + ' ' + esc(u.presa) + '</span>' +
      (inViaggio ? '<span class="sp attesa-sp"><span class="giro" aria-hidden="true"></span>' + esc(t.mando) + '</span>'
        : '<span class="sp" data-testid="bolla-arrivata-uff">' + DOPPIA + esc(t.arrivataUff) + ' ' + esc(u.arrivata) + '</span>') +
      (u.pagine > 1 ? '<span class="sp attesa-sp">' + esc(t.pagine(u.pagine)) + '</span>' : '') +
      '</span></div>';
  }
  function vistaInViaggio(u, testo) {
    mostra(spunte(u, true) + (testo ? '<div class="centro"><span class="giro g" aria-hidden="true"></span><p class="frase">' + esc(testo) + '</p></div>' : ''));
  }
  function vistaArrivata() {
    var u = ultima, r = u.r || {};
    var da = r.cantiereDa === 'bolla' ? t.dallaBolla : r.cantiereDa === 'timbratura' ? t.dallaTimbratura : '';
    mostra(
      spunte(u, false) +
      '<div class="centro" data-testid="bolla-mandata"><span class="tondo ok">' + SPUNTA(52) + '</span><h1 class="disp grande">' + esc(t.arrivata) + '</h1>' +
        '<p class="frase">' + (r.fornitore ? esc(r.fornitore) + '<br>' : '') + (r.cantiere ? esc(t.per) + ' <b>' + esc(r.cantiere) + '</b>' : esc(t.ufficioSceglie)) + '</p>' +
        (r.cantiere && da ? '<p class="nota">' + esc(da) + '</p>' : '') + (r.letta === false ? '<p class="nota">' + esc(t.laLegge) + '</p>' : '') + '</div>' +
      '<p id="avviso" class="avviso" role="alert" hidden></p>' +
      '<div class="piede"><button type="button" class="pieno" id="b-ancora" data-testid="bolla-ancora">' + CAM(24) + esc(t.altra) + '</button>' +
        (u.pagine < MAX ? '<button type="button" class="bordo" id="b-pagina" data-testid="bolla-altra">' + PIU + esc(t.altraPagina) + '</button>' : '') + '</div>'
    );
    su('b-ancora', function () { scatta('nuova'); });
    su('b-pagina', function () {
      if (navigator.onLine === false) return avviso(t.serveRete);
      scatta('pagina');
    });
  }
  function vistaNonBolla() {
    var r = ultima.r || {};
    mostra(
      '<div class="centro alto" data-testid="bolla-non-bolla"><span class="tondo warn">' + ATTENZIONE + '</span><h1 class="disp" style="font-size:44px">' + esc(t.nonBolla) + '</h1>' +
        '<p class="frase">' + esc(t.ddt) + '</p></div>' +
      '<div class="piede"><button type="button" class="pieno" id="b-rifai" data-testid="bolla-rifai">' + CAM(24) + esc(t.rifai) + '</button>' +
        '<button type="button" class="link" id="b-lascia" data-testid="bolla-lascia">' + esc(t.lascia) + '</button></div>'
    );
    su('b-rifai', function () {
      var id = ultima && ultima.id;
      scatta('nuova');  // la fotocamera si apre subito (serve il tocco); la sbagliata si scarta intanto
      if (id) fetch(API + '/' + encodeURIComponent(id) + '/scarta', { method: 'POST', keepalive: true }).catch(function () {});
    });
    su('b-lascia', vistaArrivata);
  }
  function vistaGia() {
    mostra(
      '<div class="centro alto" data-testid="bolla-cera"><span class="tondo ok">' + SPUNTA(52) + '</span><h1 class="disp" style="font-size:44px">' + esc(t.cera) + '</h1><p class="frase">' + esc(t.ceraSotto) + '</p></div>' +
      '<div class="piede"><button type="button" class="pieno" id="b-ancora">' + CAM(24) + esc(t.altra) + '</button></div>'
    );
    su('b-ancora', function () { scatta('nuova'); });
  }
  function vistaSenzaRete() {
    mostra(
      '<div class="centro alto" data-testid="bolla-senza-rete"><span class="tondo ok">' + SPUNTA(52) + '</span><h1 class="disp grande">' + esc(t.presa) + '</h1><p class="frase">' + esc(t.reteSotto) + '</p><div id="attesa"></div></div>' +
      '<div class="piede"><button type="button" class="pieno" id="b-ancora">' + CAM(24) + esc(t.altra) + '</button></div>'
    );
    su('b-ancora', function () { scatta('nuova'); });
    mostraAttesa();
  }
  function vistaErrore(testo, conRiprova) {
    mostra('<div class="centro alto"><p class="frase" role="alert">' + esc(testo) + '</p></div>' +
      '<div class="piede">' + (conRiprova ? '<button type="button" class="pieno" id="b-riprova">' + esc(t.riprova) + '</button>' : '') +
      (dalBadge ? '<a class="' + (conRiprova ? 'bordo' : 'pieno') + '" href="' + BADGE + '">' + esc(t.badge) + '</a>' : '') + '</div>');
    su('b-riprova', avvio);
  }
  function vistaInstalla() {
    var p = function (x) { return esc(x[0]) + '<b>' + esc(x[1]) + '</b>' + esc(x[2]); };
    document.getElementById('testa').innerHTML = '<span class="marchio"><span class="logo" style="color:#fff">' + CAM(18) + '</span>Bolle</span>' + (info && info.nome ? '<span class="chi">' + esc(info.nome) + '</span>' : '');
    mostra(
      '<section data-testid="bolle-installa" style="display:flex;flex-direction:column;gap:20px">' +
      '<h1 class="disp" style="font-size:42px">' + esc(t.insTitolo) + '</h1>' +
      '<p class="frase" style="font-size:18px">' + esc(t.insCiao(info && info.nome)) + '</p>' +
      '<ol class="passi">' +
        '<li><span class="num">1</span><span class="tx">' + p(t.p1) + '</span><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0A66D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg></li>' +
        '<li><span class="num">2</span><span class="tx">' + p(t.p2) + '</span><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg></li>' +
        '<li><span class="num">3</span><span class="tx">' + p(t.p3) + '</span></li>' +
      '</ol>' +
      '<p class="info">' + esc(t.safari) + '</p></section>' +
      '<div class="piede"><div class="giu"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0A66D6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>' + esc(t.qui) + '</div>' +
        '<button type="button" class="link" id="b-qui" data-testid="bolle-usa-qui">' + esc(t.usaQui) + '</button></div>'
    );
    su('b-qui', function () { try { sessionStorage.setItem('palladia_bolle_qui', '1'); } catch (e) { /* */ } testa(); vistaInizio(); });
  }
  function mostraAttesa() {
    if (!Coda) return;
    Coda.conta(code).then(function (n) {
      var el = document.getElementById('attesa'); if (!el) return;
      el.innerHTML = n ? '<span class="chip" data-testid="bolla-in-attesa">' + NORETE + esc(t.inAttesa(n)) + '</span>' : '';
    });
  }
  window.addEventListener('palladia-bolle-mandate', function () { mostraAttesa(); if (!ultima) carica().then(function () { if (!ultima) vistaInizio(); }, function () {}); });

  // ── Mandare: prima nel telefono («Presa»), poi in ufficio («Arrivata») ──
  function mandaNuova(p) {
    var voce = { client_id: uuid(), code: code, site_id: null, at: Date.now(), pagine: [{ blob: p.blob, type: p.type, name: p.name }] };
    ultima = { id: null, r: null, mini: p.url, presa: ora(), arrivata: null, pagine: 1 };
    vistaInViaggio(ultima);
    var nelTelefono = Coda ? Coda.aggiungi(voce).then(function () { return true; }, function () { return false; }) : Promise.resolve(false);
    nelTelefono.then(function (salvata) {
      var perdi = function () { if (salvata && Coda.togli) Coda.togli(voce.client_id).catch(function () {}); };
      if (navigator.onLine === false) return salvata ? vistaSenzaRete() : vistaErrore(t.errManda, false);
      var manda = Coda ? Coda.manda : null;
      if (!manda) return vistaErrore(t.errManda, false);
      manda(voce).then(function (r) {
        perdi();
        if (info) info.oggi = null;
        ultima.id = r.id; ultima.r = r; ultima.arrivata = ora();
        if (r.doppione) return vistaGia();
        if (r.nonBolla) return vistaNonBolla();
        vistaArrivata();
      }, function (e) {
        if (e.message === 'rete' || !e.status || e.status >= 500 || e.status === 429) return salvata ? vistaSenzaRete() : vistaErrore(t.errManda, false);
        perdi();
        vistaErrore(e.message === 'FILE_TOO_LARGE' ? t.grande : e.message === 'TROPPE_PAGINE' ? t.troppe : e.message === 'FILE_NON_VALIDO' ? t.tipo : e.status === 401 || e.status === 403 ? t.noBadge : t.errManda, false);
      });
    });
  }
  function aggiungiPagina(p) {
    var u = ultima;
    vistaInViaggio(u, t.aggiungo);
    var fd = new FormData(); fd.append('pagine', p.blob, p.name);
    fetch(API + '/' + encodeURIComponent(u.id) + '/pagine', { method: 'POST', body: fd })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || 'HTTP'); e.status = r.status; throw e; } return j; }); })
      .then(function (j) {
        u.pagine = j.pagine || (u.pagine + 1); u.arrivata = ora();
        u.r = Object.assign({}, u.r, { fornitore: j.fornitore || u.r.fornitore, cantiere: j.cantiere || u.r.cantiere, cantiereDa: j.cantiere && j.cantiere !== u.r.cantiere ? 'bolla' : u.r.cantiereDa });
        vistaArrivata();
      }, function (e) {
        vistaArrivata();
        avviso(e.message === 'TROPPE_PAGINE' ? t.troppe : e.message === 'FILE_TOO_LARGE' ? t.grande : !e.status ? t.serveRete : t.errManda);
      });
  }

  function carica() {
    return fetch(API, { cache: 'no-store' }).then(function (r) {
      if (r.status === 401 || r.status === 403) { var e = new Error('badge'); e.badge = true; throw e; }
      if (!r.ok) throw new Error('http');
      return r.json();
    }).then(function (j) { info = j; testa(); return j; });
  }
  function avvio() {
    testa();
    if (!/^[A-Fa-f0-9]{18}$/.test(code)) return vistaErrore(t.noBadge, false);
    var qui = false; try { qui = sessionStorage.getItem('palladia_bolle_qui') === '1'; } catch (e) { /* */ }
    var guida = !dalBadge && iOS && !installata && !qui;
    carica().then(function () { guida ? vistaInstalla() : vistaInizio(); }, function (e) {
      if (e.badge) return vistaErrore(t.noBadge, false);
      // senza rete: si può fotografare lo stesso, la bolla parte dopo
      if (navigator.onLine === false) { info = { nome: null, oggi: [] }; return vistaInizio(); }
      vistaErrore(t.errore, true);
    });
  }
  avvio();
})();
</script>
</body>
