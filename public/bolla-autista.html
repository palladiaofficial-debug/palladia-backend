<title>Fotografa la bolla — Palladia</title>
<!--
  F-500 (AUDIT.md del frontend): «Fotografa la bolla» per i nostri autisti.
  Disegno approvato il 14/11/2026 (https://claude.ai/artifact/LPH4yjojwZ2reVsnJ8Jhry).
  Una cosa per schermata, una domanda sola: «Si legge bene?».
  - Niente modulo: fornitore, numero, materiali e cantiere li legge il server.
  - Il cantiere lo chiedo solo se non si capisce (né timbratura di oggi né
    destinazione scritta): «Non lo so: decide l'ufficio».
  - Senza rete la bolla resta nel telefono e parte da sola (bolla-coda.js).
  Stessa identità del badge, nessun login: /api/v1/badge/:code/bolle.
  Stile: quello nuovo di Palladia (bianco, titoli Archivo, un tasto scuro).
  Lingue: quella scelta nel badge (palladia_badge_lang). Traduzioni non ancora
  riviste da un madrelingua.
-->
<style>

  .tondo { width: 96px; height: 96px; border-radius: 48px; display: grid; place-items: center; }
  .tondo.ok { background: #E3F1E7; color: var(--ok); }

  .giro { width: 40px; height: 40px; border: 4px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: giro .8s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }

  [dir="rtl"] .indietro svg { transform: scaleX(-1); }
  @media (prefers-reduced-motion: reduce) { .giro { animation-duration: 3s; } }

        fatte.map(function (b) { return '<div class="r"><span>' + esc(b.fornitore || '—') + (b.cantiere ? ' · ' + esc(b.cantiere) : '') + '</span><span style="color:var(--muted)">' + esc(b.ora) + '</span></div>'; }).join('') + '</section>' : '') +
      '<div class="piede"><button type="button" class="pieno" id="b-foto" data-testid="bolla-fai-foto">' + CAMERA + esc(t.foto) + '</button>' +
      '<button type="button" class="link" id="b-file" data-testid="bolla-scegli-file">' + esc(t.file) + '</button></div>'
    );
    su('b-foto', apriCamera); su('b-file', function () { fileIn.click(); });
    mostraAttesa();
  }
  function cantiereFrase() {
    if (scelto) return scelto.nome;
    if (info && info.cantiereOggi) return info.cantiereOggi.nome || '—';
    return t.loLeggo;
  }
  function vistaFoto() {
    var n = pagine.length, alta = n === 1 ? 'min(38dvh, 400px)' : 'min(32dvh, 300px)';
    mostra(
      '<div class="testa"><h1 class="disp">' + esc(t.legge) + '</h1><span class="quante" data-testid="bolla-quante">' + esc(t.pagine(n)) + '</span></div>' +
      '<div class="pagine" style="height:' + alta + '">' + pagine.map(function (p, i) {
        return '<span class="pagina">' + (p.url ? '<img src="' + p.url + '" alt="' + esc(t.pagina(i + 1)) + '">' : '<span class="pdf">PDF</span>') + '<span class="n">' + esc(t.pagina(i + 1)) + '</span></span>';
      }).join('') + '</div>' +
      '<p id="avviso" class="attesa" role="alert" hidden></p>' +
      '<button type="button" class="scheda" id="b-cambia" data-testid="bolla-cantiere"><span class="t"><span class="l">' + esc(t.perCantiere) + '</span><span class="v">' + esc(cantiereFrase()) + '</span></span><span class="c">' + esc(t.cambia) + '</span></button>' +
      '<div class="piede"><button type="button" class="pieno" id="b-manda" data-testid="bolla-manda">' + esc(t.manda) + '</button>' +
      (n < MAX ? '<button type="button" class="bordo" id="b-altra" data-testid="bolla-altra">' + PIU + esc(t.altra) + '</button>' : '') +
      '<button type="button" class="link" id="b-rifai" data-testid="bolla-rifai">' + esc(t.rifai) + '</button></div>'
    );
    su('b-manda', manda); su('b-altra', apriCamera);
    su('b-rifai', function () { svuotaPagine(); apriCamera(); vistaInizio(); });
    su('b-cambia', function () { dopoCantiere = 'prima'; vistaCantiere(); });
  }
  function vistaCantiere() {
    var lista = (info && info.cantieri) || [];
    mostra(
      '<h1 class="disp">' + esc(t.quale) + '</h1>' +
      '<p class="frase">' + esc(dopoCantiere === 'dopo' ? t.qualeSotto : t.qualeSottoPrima) + '</p>' +
      '<p id="avviso" class="attesa" role="alert" hidden></p>' +
      '<section class="elenco" data-testid="bolla-cantieri">' + lista.map(function (c) {
        return '<button type="button" class="riga" data-id="' + esc(c.id) + '"><span class="a">' + esc(c.nome) + '</span>' + (c.indirizzo ? '<span class="b">' + esc(c.indirizzo) + '</span>' : '') + '</button>';
      }).join('') + '</section>' +
      '<div class="piede"><button type="button" class="link" id="b-nonso" data-testid="bolla-non-so">' + esc(t.nonSo) + '</button></div>'
    );
    Array.prototype.forEach.call(m.querySelectorAll('.riga'), function (b) {
      b.onclick = function () {
        var c = lista.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
        if (!c) return;
        if (dopoCantiere === 'dopo') return dopoScelta(c);
        scelto = { id: c.id, nome: c.nome }; vistaFoto();
      };
    });
    su('b-nonso', function () {
      if (dopoCantiere === 'dopo') return vistaMandata(null);
      scelto = null; vistaFoto();
    });
  }
  function dopoScelta(c) {
    mostra('<div class="centro"><span class="giro" aria-hidden="true"></span></div>');
    fetch(API + '/' + encodeURIComponent(ultima.id) + '/cantiere', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ site_id: c.id }) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { vistaMandata(j && j.cantiere || c.nome); })
      .catch(function () { vistaMandata(null); });
  }
  function vistaMando() {
    mostra('<div class="centro"><span class="giro" aria-hidden="true"></span><h1 class="disp" style="font-size:36px">' + esc(t.mando) + '</h1><p class="frase">' + esc(t.mandoSotto) + '</p></div>');
  }
  function vistaMandata(cantiere) {
    if (info) info.oggi = null; // si ricarica al prossimo giro
    mostra(
      '<div class="centro" data-testid="bolla-mandata"><span class="tondo ok">' + SPUNTA + '</span><h1 class="disp" style="font-size:44px">' + esc(t.mandata) + '</h1><p class="frase" style="font-size:19px">' + esc(t.arrivata(cantiere)) + '</p></div>' +
      '<div class="piede"><a class="pieno" href="' + BADGE + '" data-testid="bolla-torna-badge">' + esc(t.torna) + '</a><button type="button" class="bordo" id="b-ancora" data-testid="bolla-ancora">' + esc(t.ancora) + '</button></div>'
    );
    su('b-ancora', function () { carica().then(vistaInizio); });
  }
  function vistaGia() {
    mostra(
      '<div class="centro" data-testid="bolla-cera"><span class="tondo ok">' + SPUNTA + '</span><h1 class="disp" style="font-size:44px">' + esc(t.cera) + '</h1><p class="frase" style="font-size:19px">' + esc(t.ceraSotto) + '</p></div>' +
      '<div class="piede"><a class="pieno" href="' + BADGE + '">' + esc(t.torna) + '</a><button type="button" class="bordo" id="b-ancora">' + esc(t.ancora) + '</button></div>'
    );
    su('b-ancora', function () { carica().then(vistaInizio); });
  }
  function vistaSenzaRete() {
    mostra(
      '<div class="centro" data-testid="bolla-senza-rete"><span class="tondo warn">' + NORETE + '</span><h1 class="disp" style="font-size:44px">' + esc(t.rete) + '</h1><p class="frase" style="font-size:19px">' + esc(t.reteSotto) + '</p></div>' +
      '<div class="piede"><a class="pieno" href="' + BADGE + '">' + esc(t.torna) + '</a></div>'
    );
  }
  function vistaErrore(testo, conRiprova) {
    mostra('<div class="centro"><p class="frase" role="alert" style="font-size:19px">' + esc(testo) + '</p></div>' +
      '<div class="piede">' + (conRiprova ? '<button type="button" class="pieno" id="b-riprova">' + esc(t.riprova) + '</button>' : '') + '<a class="' + (conRiprova ? 'bordo' : 'pieno') + '" href="' + BADGE + '">' + esc(t.torna) + '</a></div>');
    su('b-riprova', avvio);
  }
  function mostraAttesa() {
    if (!window.PalladiaBolleCoda) return;
    PalladiaBolleCoda.conta(code).then(function (n) {
      var el = document.getElementById('attesa'); if (!el) return;
      el.innerHTML = n ? '<p class="attesa" data-testid="bolla-in-attesa">' + esc(t.inAttesa(n)) + '</p>' : '';
    });
  }
  window.addEventListener('palladia-bolle-mandate', function () { mostraAttesa(); });

  // ── Mandare ──
  function manda() {
    if (!pagine.length) return;
    var voce = { client_id: uuid(), code: code, site_id: scelto ? scelto.id : null, at: Date.now(), pagine: pagine.map(function (p) { return { blob: p.blob, type: p.type, name: p.name }; }) };
    vistaMando();
    var inCoda = function () {
      if (!window.PalladiaBolleCoda) return vistaErrore(t.errManda, false);
      PalladiaBolleCoda.aggiungi(voce).then(function () { svuotaPagine(); vistaSenzaRete(); }, function () { vistaErrore(t.errManda, false); });
    };
    if (navigator.onLine === false || !window.PalladiaBolleCoda) return inCoda();
    PalladiaBolleCoda.manda(voce).then(function (r) {
      svuotaPagine();
      if (r.doppione) return vistaGia();
      if (!r.cantiere) { ultima = { id: r.id }; dopoCantiere = 'dopo'; return (info && info.cantieri && info.cantieri.length) ? vistaCantiere() : vistaMandata(null); }
      vistaMandata(r.cantiere);
    }, function (e) {
      if (e.message === 'rete' || e.status >= 500 || e.status === 429) return inCoda();
      vistaFoto();
      avviso(e.message === 'FILE_TOO_LARGE' ? t.grande : e.message === 'TROPPE_PAGINE' ? t.troppe : e.message === 'FILE_NON_VALIDO' ? t.tipo : t.errManda);
    });
  }

  function carica() {
    return fetch(API, { cache: 'no-store' }).then(function (r) {
      if (r.status === 401 || r.status === 403) { var e = new Error('badge'); e.badge = true; throw e; }
      if (!r.ok) throw new Error('http');
      return r.json();
    }).then(function (j) { info = j; document.getElementById('chi').textContent = j.nome || ''; return j; });
  }
  function avvio() {
    if (!/^[A-Fa-f0-9]{18}$/.test(code)) return vistaErrore(t.noBadge, false);
    carica().then(vistaInizio, function (e) {
      if (e.badge) return vistaErrore(t.noBadge, false);
      // senza rete: si può fotografare lo stesso, la bolla parte dopo
      if (navigator.onLine === false) { info = { nome: null, cantiereOggi: null, cantieri: [], oggi: [] }; return vistaInizio(); }
      vistaErrore(t.errore, true);
    });
  }
  avvio();
})();
</script>
</body>
</html>
